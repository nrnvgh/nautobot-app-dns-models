<div class="d-flex align-items-center">

        <a href="{% url 'plugins:nautobot_dns_models:ptrrecord_list' %}?zone={{ object.pk }}">All PTR records this catalog publishes</a>
    </span>
    {% endif %}
    {% if body_content_table_add_url %}
